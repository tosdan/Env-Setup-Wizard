name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package (for example v1.0.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform.name }} (${{ matrix.platform.support }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-amd64
            runner: windows-2025
            support: stable
          - name: linux-amd64
            runner: ubuntu-24.04
            support: stable
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            support: stable
          - name: darwin-amd64
            runner: macos-15-intel
            support: preview
          - name: darwin-arm64
            runner: macos-15
            support: preview
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TARGET: ${{ matrix.platform.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache-dependency-path: go.sum

      - name: Report toolchain and target
        run: go version && go env GOOS GOARCH

      - name: Download modules
        run: go mod download

      - name: Build, smoke test, and package
        run: go run ./internal/tools/release build -output dist

      - name: Upload canonical archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/env-wizard_*
          archive: false
          if-no-files-found: error

  assemble:
    name: Verify release set and checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          check-latest: true
          cache-dependency-path: go.sum

      - name: Download canonical archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: env-wizard_*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Verify archives and generate checksums
        run: go run ./internal/tools/release finalize -input dist -output dist

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/SHA256SUMS
          archive: false
          if-no-files-found: error
